<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <script>
    (function () {
      try { if (localStorage.getItem("theme") === "dark") document.documentElement.classList.add("dark"); } catch (e) {}
    })();
  </script>
  <title>고척교회 찬양 아카이브</title>
  <meta name="description" content="고척교회 주일 예배 찬양 영상 아카이브 — 10년의 찬양을 한 곳에서" />

  <link rel="icon" href="favicon.png" />
  <link rel="apple-touch-icon" href="favicon.png" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#1a3a6b" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="찬양아카이브" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="찬양 아카이브 | 오직 성경, 말씀이 답이다!" />
  <meta property="og:description" content="주의 말씀은 내 발에 등이요 내 길에 빛이니이다" />
  <meta property="og:image" content="https://worship.onlybible.kr/og-cover.png?v=2" />
  <meta property="og:image:secure_url" content="https://worship.onlybible.kr/og-cover.png?v=2" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="고척교회 찬양 아카이브" />
  <meta property="og:url" content="https://worship.onlybible.kr/" />
  <meta property="og:site_name" content="고척교회 찬양 아카이브" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=20260708c" />
</head>
<body>
  <div id="splash">
    <div class="splash-inner">
      <img id="splash-logo" src="https://summer.onlybible.kr/logo3.png" alt="고척교회" />
      <div class="splash-title">고척교회 찬양 아카이브</div>
      <div class="splash-sub">오직 성경, 말씀이 답이다!</div>
      <div class="splash-ver">v1.46</div>
    </div>
  </div>
  <script>
    window.hideSplash = function () {
      var s = document.getElementById("splash");
      if (!s) return;
      s.classList.add("hide");
      setTimeout(function () { if (s && s.parentNode) s.parentNode.removeChild(s); }, 400);
    };
    setTimeout(window.hideSplash, 6000);
  </script>

  <header class="topbar">
    <div class="brand">
      <img src="https://summer.onlybible.kr/logo3.png" alt="고척교회" />
      <div class="brand-txt">
        <b>찬양 아카이브</b>
        <span>고척교회 · 예배 찬양</span>
      </div>
    </div>
    <div class="topbar-actions">
      <button id="goto-memorize" class="icon-btn" aria-label="성경말씀 암송으로 가기" title="성경말씀 암송으로 가기">📖</button>
      <button id="share-btn" class="icon-btn" aria-label="성경암송 앱 공유하기" title="성경말씀 암송 앱 공유하기">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle>
          <line x1="8.6" y1="13.5" x2="15.4" y2="17.5"></line><line x1="15.4" y1="6.5" x2="8.6" y2="10.5"></line>
        </svg>
      </button>
      <button id="theme-toggle" class="icon-btn" aria-label="야간 모드">🌙</button>
    </div>
  </header>

  <main id="app">
    <div id="home"></div>
    <button id="browse-toggle" class="browse-toggle">🔍 전체 찬양 둘러보기 ▾</button>
    <div id="browse" hidden>
      <div id="controls"></div>
      <div id="count" class="count-line"></div>
      <div id="grid" class="grid">
        <p class="loading">불러오는 중…</p>
      </div>
    </div>
  </main>

  <div id="player-modal" class="modal" hidden>
    <div class="modal-bg" data-close></div>
    <div class="modal-box">
      <button class="modal-x" data-close aria-label="닫기">✕</button>
      <div class="yt-wrap"><div class="yt-frame"><div id="yt-player"></div></div></div>
      <div class="pl-meta">
        <h3 id="pl-title">—</h3>
        <p id="pl-sub"></p>
      </div>
      <div class="pl-controls">
        <div class="pl-toggles">
          <button id="pl-repeat" class="pl-tog" aria-pressed="false">🔁 반복</button>
          <button id="pl-shuffle" class="pl-tog" aria-pressed="false">🔀 셔플</button>
        </div>
        <div class="pl-nav">
          <button id="pl-prev" class="pl-btn">⏮ 이전</button>
          <button id="pl-next" class="pl-btn">다음 ⏭</button>
        </div>
      </div>
    </div>
  </div>

  <footer class="foot">고척교회 찬양 아카이브</footer>

  <script>
    (function () {
      var btn = document.getElementById("theme-toggle");
      function sync() { btn.textContent = document.documentElement.classList.contains("dark") ? "☀️" : "🌙"; }
      btn.addEventListener("click", function () {
        var dark = document.documentElement.classList.toggle("dark");
        try { localStorage.setItem("theme", dark ? "dark" : "light"); } catch (e) {}
        sync();
      });
      sync();

      // 공유하기
      function toast(msg) {
        var t = document.createElement("div");
        t.className = "share-toast";
        t.textContent = msg;
        document.body.appendChild(t);
        requestAnimationFrame(function () { t.classList.add("show"); });
        setTimeout(function () { t.classList.remove("show"); setTimeout(function () { t.remove(); }, 300); }, 2000);
      }
      var goMem = document.getElementById("goto-memorize");
      if (goMem) goMem.addEventListener("click", function () { location.href = "https://gocheok.onlybible.kr/"; });
      var shareBtn = document.getElementById("share-btn");
      if (shareBtn) shareBtn.addEventListener("click", function () {
        var url = "https://gocheok.onlybible.kr/";
        var data = { title: "고척교회 성경말씀 암송", text: "말씀을 마음에 새겨요 — 함께 성경암송! 📖", url: url };
        if (navigator.share) {
          navigator.share(data).catch(function () {});
        } else if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(url).then(function () { toast("링크가 복사되었어요! 📋"); }).catch(function () { window.prompt("이 링크를 복사하세요", url); });
        } else {
          window.prompt("이 링크를 복사하세요", url);
        }
      });
    })();
  </script>
  <script src="js/config.js?v=20260708c"></script>
  <script src="js/api.js?v=20260708c"></script>
  <script src="app.js?v=20260708c"></script>
</body>
</html>
